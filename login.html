<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta name="author" content="" />

  <title>Login - V-Alarish</title>
  <link rel="stylesheet" type="text/css"
    href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.1.3/assets/owl.carousel.min.css" />
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
  <link href="https://fonts.googleapis.com/css?family=Baloo+Chettan|Poppins:400,600,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/responsive.css" rel="stylesheet" />

  <style>
    body {
      min-height: 100vh;
      background-image: url("images/bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .va-auth-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 12px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .va-auth-error {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(220, 53, 69, 0.12);
      color: #b02a37;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="hero_area">
    <header class="header_section" id="header">
      <div class="container-fluid">
        <nav class="navbar navbar-expand-lg custom_nav-container ">
          <a class="navbar-brand" href="index.html">
            <img src="images/logo.png" alt="">
            <span style="font-size:medium;margin-left:5px;">
              ALARISH
            </span>
          </a>
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <div class="d-flex ml-auto flex-column flex-lg-row align-items-center">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="index.html#header">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="index.html#about">About</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="index.html#booking">Booking</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="index.html#contact">Contact us</a>
                </li>
                <li class="nav-item active" id="va-auth-slot">
                  <a class="nav-link" href="login.html">Login <span class="sr-only">(current)</span></a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </header>
  </div>

  <section class="contact_section layout_padding">
    <div class="container">
      <div class="heading_container">
        <h2>Login</h2>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="va-auth-card">
            <form id="loginForm">
              <div>
                <input id="email" type="email" placeholder="Email" required />
              </div>
              <div>
                <input id="password" type="password" placeholder="Password" required />
              </div>
              <div class="d-flex">
                <button type="submit">Login</button>
              </div>

              <div class="va-auth-error" id="errorBox"></div>

              <div class="mt-3">
                Don’t have an account? <a href="signup.html">Sign up</a>
                <div class="mt-2">
                  <a href="index.html">Back to Home</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="container-fluid footer_section">
    <p>
      &copy; <span id="displayYear"></span> Coded By
      <a href="#">Aya kamal</a>
    </p>
  </section>

  <script type="text/javascript" src="js/jquery-3.4.1.min.js"></script>
  <script type="text/javascript" src="js/bootstrap.js"></script>
  <script type="text/javascript" src="js/custom.js"></script>
  <script type="text/javascript" src="js/auth.js"></script>
  <script>
    window.VAAuth && window.VAAuth.initNavbarAuth && window.VAAuth.initNavbarAuth();

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("errorBox");

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";

      const payload = {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          return showError(data.message || "Login failed");
        }

        window.VAAuth.setCurrentUser(data.user);
        window.location.href = "index.html";
      } catch {
        showError("Server is not running. Start it with: npm install ثم npm start");
      }
    });
  </script>
</body>

</html>
